appId: com.foodbaskets.pos
productName: FoodBaskets POS
copyright: Copyright © 2026 Food Baskets Corporation

directories:
  output: release
  buildResources: build

files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "package.json"

win:
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: FoodBaskets POS

portable:
  artifactName: FoodBaskets-POS-Portable.exe
